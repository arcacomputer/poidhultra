name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Regression and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm test:services
      - run: pnpm typecheck
      - run: pnpm --filter @poidh/web test --runInBand
  cloudflare:
    name: Cloudflare and Node builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poidh/web build:cloudflare
      - run: pnpm --filter @poidh/community-api build
      - run: pnpm --filter @poidh/community-api exec wrangler deploy --config wrangler.gateway.jsonc --dry-run --outdir dist-gateway
      - run: pnpm --filter @poidh/supervisor exec wrangler deploy --dry-run --containers-rollout=none --outdir dist
      - run: node tests/watchdog-runtime.mjs
      - run: docker build -f infra/cloudflare/indexer.Dockerfile -t poidh-indexer:test .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
  contracts:
    name: Upstream contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: forge test --no-match-contract PoidhV3ForkTest
        working-directory: contracts/poidh-v3
      - run: forge test
        working-directory: contracts/wei-names

  indexer:
    name: Indexer recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: poidh_indexer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: forge build
        working-directory: contracts/poidh-v3
      - run: pnpm test:indexer
        env:
          INDEXER_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/poidh_indexer_test
